#
# Milvus → pgvector Migration Configuration Template
#
# Usage:
#   java ... MigrationCli --config migration-config.properties
#
# This file uses a flat key=value format (Java Properties) for direct use
# with the --config flag. The YAML structure below is for human readability;
# flatten the keys (e.g. milvus.url=...) when using as a properties file.
#
# CLI arguments always override values from the config file.
#

# ---- Milvus source ----
milvus.url=http://localhost:19530
milvus.token=
milvus.database=default
milvus.collection=my_collection

# ---- pgvector target ----
pg.url=jdbc:postgresql://localhost:5432/vectordb
pg.user=postgres
pg.password=postgres
pg.schema=public
# pg.table defaults to the collection name if left empty
pg.table=

# ---- performance ----
batch.size=1000
parallelism=1
# Max rows per second; 0 = unlimited
rate.limit=0

# ---- behavior ----
skip.index.migration=false
drop.existing.table=false
# If true, forbids BFloat16 → halfvec precision loss
no.precision.loss=false

# ---- phase control ----
# Set one of these to true to run only that phase
# validate.only=false
# schema.only=false
# data.only=false
# resume=false

# ---- validation ----
sample.size=100
similarity.threshold=0.9999

# ---- audit ----
audit.log_dir=./migration-logs

# ---- seatunnel ----
# Leave empty to use SEATUNNEL_HOME environment variable
seatunnel.home=

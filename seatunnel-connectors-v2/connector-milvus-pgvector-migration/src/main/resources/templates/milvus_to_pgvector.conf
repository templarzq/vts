#
# Milvus → pgvector migration SeaTunnel job template.
#
# Variables (${var}) are replaced either by the CLI orchestrator or by SeaTunnel's
# own variable substitution (`-i key=value` on the seatunnel CLI).
#
# Required variables:
#   milvus.url, milvus.token, milvus.database, milvus.collection
#   pg.url, pg.user, pg.password, pg.database, pg.schema, pg.table
#   batch.size
#
# Rate control: tune env.parallelism and source.Milvus.batch_size to limit pressure
# on source/target databases. For finer row-level control use the CLI orchestrator
# which applies a TokenBucketRateLimiter to its direct-JDBC path.
#

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Milvus {
    url = "${milvus.url}"
    token = "${milvus.token}"
    database = "${milvus.database}"
    collections = ["${milvus.collection}"]
    batch_size = ${batch.size}
  }
}

transform {
  MilvusToPgVector {
    pg_schema = "${pg.schema}"
    pg_table = "${pg.table}"
    allow_precision_loss = true
  }
}

sink {
  Jdbc {
    url = "${pg.url}"
    driver = "org.postgresql.Driver"
    user = "${pg.user}"
    password = "${pg.password}"
    compatible_mode = "pgvector"
    generate_sink_sql = true
    database = "${pg.database}"
    table = "${pg.schema}.${pg.table}"
  }
}

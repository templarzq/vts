#
# Milvus → pgvector validation SeaTunnel job template.
#
# This job reads rows from Milvus, compares each sampled vector against the
# already-migrated pgvector row, and logs the validation result. Rows are
# pass-through to the Console sink (discard the output in production).
#
# For high-performance validation prefer the CLI orchestrator's --validate-only
# mode, which queries both databases directly without a SeaTunnel job.
#

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Milvus {
    url = "${milvus.url}"
    token = "${milvus.token}"
    database = "${milvus.database}"
    collections = ["${milvus.collection}"]
    batch_size = 100
  }
}

transform {
  VectorValidation {
    pg_url = "${pg.url}"
    pg_user = "${pg.user}"
    pg_password = "${pg.password}"
    pg_table = "${pg.schema}.${pg.table}"
    sample_size = 100
    similarity_threshold = 0.9999
  }
}

sink {
  Console {}
}
